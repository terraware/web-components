name: Publish RC

on:
  issue_comment:
    types:
      - created
  # TODO: Remove once RC trusted publishing works. Comment-triggered runs always use the workflow on main, so this
  # lets us test changes to the workflow from a branch.
  push:
    branches-ignore:
      - main

jobs:
  publish-rc:
    # This job only runs for pull request comments
    name: Publish RC PR comment
    if: github.event_name == 'push' || (github.event.issue.pull_request && contains(github.event.comment.body, 'publish rc'))
    runs-on: ubuntu-latest
    permissions:
      # Lets npm authenticate to the registry via OIDC instead of a long-lived token.
      id-token: write
      contents: write
    steps:
      - name: Get Branch
        id: 'get-branch'
        run: |
          if [[ "$EVENT_NAME" == push ]]; then
            echo "branch=$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "branch=$(gh pr view $PR_NUMBER --repo $REPO --json headRefName --jq '.headRefName')" >> "$GITHUB_OUTPUT"
          fi
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.GH_DEPLOY_REPO_TOKEN }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.get-branch.outputs.branch }}

      # Since this is an explicit publish, we just set the registry provider explicitly
      - name: Set Environment
        shell: bash
        run: echo "ARTIFACT_REGISTRY_PROVIDER=npm" >> $GITHUB_ENV

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Install Dependencies
        run: |
          yarn install --network-timeout 100000
          git checkout -- package.json

      - name: Linter
        run: yarn lint

      - name: Unit tests
        run: yarn test

      - name: Git config
        run: |
          git config --global user.email "${{ secrets.GH_DEPLOY_EMAIL }}"
          git config --global user.name "${{ secrets.GH_DEPLOY_USER }}"

      - name: Apply version bump (rc)
        run: npm version prerelease --preid=rc -m "Publishing RC - %s"

      - name: Git push version bump
        run: git push origin ${{ steps.get-branch.outputs.branch }} --follow-tags --force

      - name: Build
        run: yarn build-dist

      - name: License report
        run: yarn license-report-dist

      - name: Compare artifact package version
        run: .github/scripts/compare-artifact-package-versions.sh

      - name: Prune package.json
        run: |
          cd dist
          npm pkg delete scripts
          npm pkg delete devDependencies
          npm pkg delete eslintConfig
          npm pkg delete resolutions
          npm pkg delete browserslist
          pwd
          cat `pwd`/package.json

      # TODO: Remove once RC trusted publishing works.
      - name: Show OIDC claims
        run: |
          curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" |
            node -e '
              const jwt = JSON.parse(require("fs").readFileSync(0, "utf8")).value;
              const claims = JSON.parse(Buffer.from(jwt.split(".")[1], "base64url").toString());
              const { repository, repository_owner, workflow_ref, job_workflow_ref, event_name, ref, environment } = claims;
              console.log({ repository, repository_owner, workflow_ref, job_workflow_ref, event_name, ref, environment });
            '

      - name: Publish npm package
        if: env.UPDATE_NPM_PACKAGE == 'true'
        run: cd dist && npm publish --scope @terraware --tag rc --loglevel verbose

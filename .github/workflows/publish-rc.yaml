name: Publish RC

# Dispatched by publish-rc-comment.yaml when someone comments "publish rc" on a PR. Can also be run manually with
# `gh workflow run publish-rc.yaml --ref <branch>`.
on:
  workflow_dispatch:

jobs:
  publish-rc:
    name: Publish RC
    runs-on: ubuntu-latest
    permissions:
      # Lets npm authenticate to the registry via OIDC instead of a long-lived token.
      id-token: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Since this is an explicit publish, we just set the registry provider explicitly
      - name: Set Environment
        shell: bash
        run: echo "ARTIFACT_REGISTRY_PROVIDER=npm" >> $GITHUB_ENV

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install Dependencies
        run: |
          yarn install --network-timeout 100000
          git checkout -- package.json

      - name: Linter
        run: yarn lint

      - name: Unit tests
        run: yarn test

      - name: Git config
        run: |
          git config --global user.email "${{ secrets.GH_DEPLOY_EMAIL }}"
          git config --global user.name "${{ secrets.GH_DEPLOY_USER }}"

      - name: Apply version bump (rc)
        run: npm version prerelease --preid=rc -m "Publishing RC - %s"

      - name: Git push version bump
        run: git push origin ${{ github.ref_name }} --follow-tags --force

      - name: Build
        run: yarn build-dist

      - name: License report
        run: yarn license-report-dist

      - name: Compare artifact package version
        run: .github/scripts/compare-artifact-package-versions.sh

      - name: Prune package.json
        run: |
          cd dist
          npm pkg delete scripts
          npm pkg delete devDependencies
          npm pkg delete resolutions
          npm pkg delete browserslist
          pwd
          cat `pwd`/package.json

      - name: Publish npm package
        if: env.UPDATE_NPM_PACKAGE == 'true'
        run: cd dist && npm publish --scope @terraware --tag rc

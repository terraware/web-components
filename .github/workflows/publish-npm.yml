name: Publish npm package

on:
  push:
    # The tag is pushed by the Buildkite "version-bump" step which triggers this workflow.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  ARTIFACT_REGISTRY_PROVIDER: npm

jobs:
  publish-npm:
    name: Publish npm package
    runs-on: ubuntu-latest
    permissions:
      # Lets npm authenticate to the registry via OIDC instead of a long-lived token.
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: |
          yarn install --frozen-lockfile --network-timeout 100000
          git checkout -- package.json

      - name: Build
        run: yarn build-dist

      - name: Verify tag matches package version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          DIST_VERSION=$(node -e "process.stdout.write(require('./dist/package.json').version)")
          if [[ "$TAG_VERSION" != "$DIST_VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME implies $TAG_VERSION but dist/package.json is $DIST_VERSION" >&2
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches dist/package.json version $DIST_VERSION"

      - name: License report
        run: yarn license-report-dist

      - name: Compare artifact package version
        run: .github/scripts/compare-artifact-package-versions.sh

      - name: Prune package.json
        run: |
          cd dist
          npm pkg delete scripts
          npm pkg delete devDependencies
          npm pkg delete eslintConfig
          npm pkg delete resolutions
          npm pkg delete browserslist
          cat package.json

      - name: Publish npm package
        if: env.UPDATE_NPM_PACKAGE == 'true'
        run: cd dist && npm publish --scope @terraware
